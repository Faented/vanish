[package]
name = "vanish"
description = "vanish: secure, honest file/directory deletion (CLI)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "vanish"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
vanish-core = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
backend-linux = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
backend-macos = { workspace = true }

[target.'cfg(not(any(target_os = "linux", target_os = "macos")))'.dependencies]
backend-windows = { workspace = true }
